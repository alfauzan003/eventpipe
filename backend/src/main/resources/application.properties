spring.application.name=eventpipe

# RabbitMQ topology
eventpipe.exchange=eventpipe.events
eventpipe.queue=eventpipe.events
eventpipe.last-limit=20

# Dead-letter topology: poison events land here once retries are exhausted
eventpipe.dlx-exchange=eventpipe.events.dlx
eventpipe.dlq=eventpipe.events.dlq
eventpipe.dlq-routing-key=eventpipe.events.dlq

# RabbitMQ connection (overridable via env for tests / CI)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Manual acks: the consumer acks/nacks each message explicitly.
# Retry with backoff + reject-and-dont-requeue are wired on the custom
# SimpleRabbitListenerContainerFactory in RabbitConfig (see that class).
spring.rabbitmq.listener.simple.acknowledge-mode=manual
